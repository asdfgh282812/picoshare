{{ define "style-tags" }}
  <style nonce="{{ .CspNonce }}">
    #default-expiration,
    #download-history-retention {
      max-width: 9ch;
    }
  </style>
{{ end }}

{{ define "script-tags" }}
  <script type="module" nonce="{{ .CspNonce }}">
    import { settingsPut } from "/js/controllers/settings.js";
    import { showElement, hideElement } from "/js/lib/bulma.js";
    import { enableElement, disableElement } from "/js/lib/html.js";

    const errorContainer = document.getElementById("error");
    const progressSpinner = document.getElementById("progress-spinner");
    const defaultExpiration = document.getElementById("default-expiration");
    const timeUnit = document.getElementById("time-unit");
    const storeForeverCheckbox = document.getElementById(
      "store-forever-checkbox",
    );
    const downloadHistoryRetention = document.getElementById(
      "download-history-retention",
    );
    const keepDownloadHistoryForeverCheckbox = document.getElementById(
      "keep-download-history-forever-checkbox",
    );
    const saveBtn = document.querySelector(
      "#settings-form button[type='submit']",
    );

    const daysPerYear = 365;

    function readDefaultFileExpiration() {
      let defaultExpirationDays = parseInt(defaultExpiration.value);
      if (timeUnit.value === "years") {
        defaultExpirationDays *= daysPerYear;
      }
      return defaultExpirationDays;
    }

    function readSettings() {
      const settings = {};
      if (storeForeverCheckbox.checked) {
        settings.defaultNeverExpire = true;
      } else {
        settings.defaultExpirationDays = readDefaultFileExpiration();
      }
      if (keepDownloadHistoryForeverCheckbox.checked) {
        settings.keepDownloadHistoryForever = true;
      } else {
        settings.downloadHistoryRetentionDays = parseInt(
          downloadHistoryRetention.value,
        );
      }
      return settings;
    }

    defaultExpiration.addEventListener("input", () => {
      enableElement(saveBtn);
    });

    downloadHistoryRetention.addEventListener("input", () => {
      enableElement(saveBtn);
    });

    keepDownloadHistoryForeverCheckbox.addEventListener("change", (evt) => {
      enableElement(saveBtn);
      if (evt.target.checked) {
        disableElement(downloadHistoryRetention);
      } else {
        enableElement(downloadHistoryRetention);
      }
    });

    timeUnit.addEventListener("change", (evt) => {
      const maxExpirationInYears = 10;
      if (evt.target.value === "years") {
        defaultExpiration.setAttribute("max", maxExpirationInYears);
      } else {
        defaultExpiration.setAttribute(
          "max",
          daysPerYear * maxExpirationInYears,
        );
      }
      enableElement(saveBtn);
    });

    storeForeverCheckbox.addEventListener("change", (evt) => {
      enableElement(saveBtn);
      const neverExpire = evt.target.checked;

      if (neverExpire) {
        disableElement(defaultExpiration);
        disableElement(timeUnit);
      } else {
        enableElement(defaultExpiration);
        enableElement(timeUnit);
      }
    });

    document
      .getElementById("settings-form")
      .addEventListener("submit", (evt) => {
        evt.preventDefault();

        hideElement(errorContainer);
        showElement(progressSpinner);
        disableElement(saveBtn);

        settingsPut(readSettings())
          .then(() => {
            document
              .querySelector("snackbar-notifications")
              .addInfoMessage("Settings saved");
          })
          .catch((error) => {
            document.getElementById("error-message").innerText = error;
            showElement(errorContainer);
          })
          .finally(() => {
            hideElement(progressSpinner);
            enableElement(saveBtn);
          });
      });

    document
      .querySelector("#error .btn-close")
      .addEventListener("click", () => {
        hideElement(errorContainer);
      });
  </script>
{{ end }}

{{ define "content" }}
  <h1 class="h1">Settings</h1>

  <form id="settings-form">
    <fieldset class="border rounded p-3 mb-4">
      <legend class="float-none w-auto px-2 fs-6 mb-0">
        Default File Expiration
      </legend>

      <div class="form-check my-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="store-forever-checkbox"
          {{ if .DefaultNeverExpire }}checked{{ end }}
        />
        <label class="form-check-label" for="store-forever-checkbox">
          Store files forever
        </label>
      </div>
      <div class="input-group">
        <input
          id="default-expiration"
          class="form-control"
          type="number"
          required
          min="1"
          {{ if eq .ExpirationTimeUnit "days" }}
            max="3650"
          {{ else }}
            max="10"
          {{ end }}
          {{ if .DefaultNeverExpire }}disabled{{ end }}
          size="3"
          value="{{ .DefaultExpiration }}"
        />
        <select
          id="time-unit"
          class="form-select"
          {{ if .DefaultNeverExpire }}disabled{{ end }}
        >
          <option
            value="days"
            {{ if eq .ExpirationTimeUnit "days" }}
              selected
            {{ end }}
          >
            Days
          </option>
          <option
            value="years"
            {{ if eq .ExpirationTimeUnit "years" }}selected{{ end }}
          >
            Years
          </option>
        </select>
      </div>
    </fieldset>

    <fieldset class="border rounded p-3 mb-4">
      <legend class="float-none w-auto px-2 fs-6 mb-0">Download History</legend>

      <div class="form-check my-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="keep-download-history-forever-checkbox"
          {{ if .KeepDownloadHistoryForever }}checked{{ end }}
        />
        <label
          class="form-check-label"
          for="keep-download-history-forever-checkbox"
        >
          Keep download history forever
        </label>
      </div>
      <label class="form-label" for="download-history-retention">
        Delete download records older than
      </label>
      <div class="input-group">
        <input
          id="download-history-retention"
          class="form-control"
          type="number"
          required
          min="1"
          max="{{ .MaxDownloadHistoryRetentionDays }}"
          {{ if .KeepDownloadHistoryForever }}disabled{{ end }}
          size="4"
          value="{{ .DownloadHistoryRetentionDays }}"
        />
        <span class="input-group-text">days</span>
      </div>
    </fieldset>

    <div>
      <button class="btn btn-primary" disabled type="submit">
        <i class="fa-solid fa-floppy-disk me-2"></i>
        Save
      </button>
    </div>
  </form>

  <div class="fa-3x d-none" id="progress-spinner">
    <i class="fa-solid fa-spinner fa-spin"></i>
  </div>

  <div id="error" class="d-none my-3">
    <div
      class="alert alert-danger d-flex justify-content-between align-items-start"
      role="alert"
    >
      <div>
        <strong>Error</strong>
        <div id="error-message" class="mt-1">Placeholder error.</div>
      </div>
      <button class="btn-close" type="button" aria-label="Close"></button>
    </div>
  </div>
{{ end }}
