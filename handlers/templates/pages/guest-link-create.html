{{ define "script-tags" }}
  <script type="module" nonce="{{ .CspNonce }}">
    import { guestLinkNew } from "/js/controllers/guestLinks.js";
    import { showElement, hideElement } from "/js/lib/visibility.js";
    import { enableElement, disableElement } from "/js/lib/html.js";

    const labelInput = document.getElementById("label");
    const expirationSelect = document.getElementById("expiration-select");
    const fileExpirationSelect = document.getElementById(
      "file-expiration-select",
    );
    const maxFileBytesInput = document.getElementById("max-file-size");
    const fileUploadLimitInput = document.getElementById("file-upload-limit");
    const createLinkForm = document.getElementById("create-guest-link-form");
    const createBtn = document.querySelector(
      "#create-guest-link-form button[type='submit']",
    );
    const errorContainer = document.getElementById("error");
    const progressSpinner = document.getElementById("progress-spinner");

    function megabytesToBytes(megabytes) {
      return megabytes * 1024 * 1024;
    }

    function guestLinkFromInputs() {
      return {
        label: labelInput.value || null,
        urlExpirationTime: expirationSelect.value,
        fileLifetime: fileExpirationSelect.value,
        maxFileBytes: maxFileBytesInput.valueAsNumber
          ? megabytesToBytes(maxFileBytesInput.valueAsNumber)
          : null,
        maxFileUploads: fileUploadLimitInput.valueAsNumber
          ? fileUploadLimitInput.valueAsNumber
          : null,
      };
    }

    createLinkForm.addEventListener("submit", (evt) => {
      evt.preventDefault();

      disableElement(createBtn);
      showElement(progressSpinner);
      hideElement(errorContainer);

      const guestLink = guestLinkFromInputs();
      guestLinkNew(
        guestLink.label,
        guestLink.urlExpirationTime,
        guestLink.fileLifetime,
        guestLink.maxFileBytes,
        guestLink.maxFileUploads,
      )
        .then(() => {
          document.location = "/guest-links";
        })
        .catch((error) => {
          document.getElementById("error-message").innerText = error;
          showElement(errorContainer);
        })
        .finally(() => {
          hideElement(progressSpinner);
          enableElement(createBtn);
        });
    });

    document
      .querySelector("#error .btn-close")
      .addEventListener("click", () => {
        hideElement(errorContainer);
      });
  </script>
{{ end }}

{{ define "content" }}
  <h1 class="h1">{{ .L.T "guestLinkCreate.heading" }}</h1>

  <form id="create-guest-link-form">
    <div class="mb-4">
      <label class="form-label"
        >{{ .L.T "guestLinkCreate.label" }}
        <i>{{ .L.T "common.optional" }}</i></label
      >
      <input
        id="label"
        class="form-control"
        type="text"
        placeholder="{{ .L.T "guestLinkCreate.labelPlaceholder" }}"
      />
      <p class="form-text">{{ .L.T "guestLinkCreate.labelHint" }}</p>
    </div>

    <div class="mb-4">
      <label class="form-label">{{ .L.T "guestLinkCreate.urlExpires" }}</label>
      <select id="expiration-select" class="form-select">
        {{ range .ExpirationOptions }}
          <option
            value="{{ formatExpiration .Expiration }}"
            {{ if .IsDefault }}selected{{ end }}
          >
            {{ .FriendlyName }}
          </option>
        {{ end }}
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label"
        >{{ .L.T "guestLinkCreate.filesExpire" }}</label
      >
      <select id="file-expiration-select" class="form-select">
        {{ $l := .L }}
        {{ range .FileLifetimeOptions }}
          <option
            value="{{ formatLifetime .FileLifetime }}"
            {{ if .IsDefault }}selected{{ end }}
          >
            {{ friendlyLifetime .FileLifetime $l }}
          </option>
        {{ end }}
      </select>
    </div>

    <div class="mb-4">
      <label class="form-label"
        >{{ .L.T "guestLinkCreate.maxFileSize" }}
        <i>{{ .L.T "common.optional" }}</i></label
      >
      <div class="input-group">
        <input
          id="max-file-size"
          class="form-control"
          type="number"
          min="1"
          placeholder="40"
        />
        <span class="input-group-text">{{ .L.T "guestLinkCreate.mb" }}</span>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label"
        >{{ .L.T "guestLinkCreate.uploadLimit" }}
        <i>{{ .L.T "common.optional" }}</i></label
      >
      <div class="input-group">
        <input
          id="file-upload-limit"
          class="form-control"
          type="number"
          min="1"
          placeholder="5"
        />
        <span class="input-group-text"
          >{{ .L.T "guestLinkCreate.fileUploadsUnit" }}</span
        >
      </div>
    </div>

    <div>
      <button type="submit" class="btn btn-primary">
        {{ .L.T "common.create" }}
      </button>
    </div>
  </form>

  <div class="fa-3x d-none" id="progress-spinner">
    <i class="fa-solid fa-spinner fa-spin"></i>
  </div>

  <div id="error" class="d-none my-5">
    <div
      class="alert alert-danger d-flex justify-content-between align-items-start"
      role="alert"
    >
      <div>
        <strong>{{ .L.T "common.error" }}</strong>
        <div id="error-message" class="mt-1">
          {{ .L.T "common.placeholderError" }}
        </div>
      </div>
      <button
        class="btn-close"
        type="button"
        aria-label="{{ .L.T "common.close" }}"
      ></button>
    </div>
  </div>
{{ end }}
